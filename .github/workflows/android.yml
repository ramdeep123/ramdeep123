name: Test & build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship a full Android SDK (ANDROID_HOME), so the
      # script uses its latest platform and build-tools (aapt2, d8, apksigner).

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KAYA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAYA_KEYSTORE_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/kaya-release.keystore
          printf 'storeFile=kaya-release.keystore\nstorePassword=%s\nkeyAlias=kaya\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Build signed APK
        run: VERSION_CODE=${{ github.run_number }} bash android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KAYA-apk
          path: release/*.apk
